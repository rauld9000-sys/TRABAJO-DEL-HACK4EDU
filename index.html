
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Penguich | Bienvenido</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="penguich-auth">

  <!-- BARRA DE ACCESIBILIDAD -->
  <div class="accessibility-bar">
    <label for="color-filter">👁️ Filtro:</label>

    <select id="color-filter" onchange="changeColorFilter(this.value)">
      <option value="normal">Estándar</option>
      <option value="protanopia">Protanopía</option>
      <option value="deuteranopia">Deuteranopía</option>
      <option value="tritanopia">Tritanopía</option>
    </select>
  </div>

  <!-- DECORACIONES -->
  <div class="floating-element fe-1">⭐</div>
  <div class="floating-element fe-2">🎨</div>
  <div class="floating-element fe-3">🚀</div>
  <div class="floating-element fe-4">💡</div>

  <!-- INICIO -->
  <main class="penguich-welcome">

    <img
      src="img/Penguich sobre un arcoíris pastel.png"
      alt="Mascota de Penguich"
      class="penguich-mascot"
    >

    <h1>Penguich</h1>

    <p>¡Aprende, descubre y brilla a tu ritmo!</p>

    <div class="penguich-buttons">

      <!-- INICIAR SESIÓN -->
      <a
        href="conexion.php?modo=login"
        class="penguich-btn btn-login"
      >
        🚀 Iniciar sesión
      </a>

      <!-- CREAR CUENTA -->
      <a
        href="conexion.php?modo=registro"
        class="penguich-btn btn-register"
      >
        ⭐ Crear cuenta
      </a>

    </div>

  </main>

  <script>
    function changeColorFilter(mode) {

      document.body.classList.remove(
        'protanopia',
        'deuteranopia',
        'tritanopia'
      );

      if (mode !== 'normal') {
        document.body.classList.add(mode);
      }

      localStorage.setItem('penguichFiltro', mode);
    }

    const filtro =
      localStorage.getItem('penguichFiltro') || 'normal';

    document.getElementById('color-filter').value = filtro;

    changeColorFilter(filtro);
  </script>

</body>
</html>
